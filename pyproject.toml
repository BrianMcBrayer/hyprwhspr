[project]
name = "hyprwhspr"
version = "0.1.0"
description = "Ferocious speech-to-text for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["speech-to-text", "whisper", "linux", "wayland", "hyprland"]

dependencies = [
    # Audio processing
    "sounddevice>=0.4.6",
    "numpy>=1.21.0",
    "scipy>=1.10.0",

    # Global shortcuts and text injection
    "evdev>=1.6.0",
    "pyperclip>=1.8.2",

    # Whisper integration
    "pywhispercpp==1.4.0",
    "requests>=2.25.0",
    "websocket-client>=1.9.0",

    # System integration (pip-installable)
    "psutil>=5.8.0",
    "pyudev>=0.24.0",
    "pulsectl>=24.4.0",

    # CLI formatting
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
onnx-gpu = ["onnx-asr[hub]>=0.10.0", "onnxruntime-gpu>=1.24.0"]
onnx-cpu = ["onnx-asr[cpu,hub]>=0.10.0"]

[project.scripts]
hyprwhspr = "lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.uv]
package = true

# CUDA 13 nightly builds for onnxruntime-gpu
[[tool.uv.index]]
name = "ort-cuda-13"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ort-cuda-13-nightly/pypi/simple/"
explicit = true

[tool.uv.sources]
onnxruntime-gpu = { index = "ort-cuda-13" }
